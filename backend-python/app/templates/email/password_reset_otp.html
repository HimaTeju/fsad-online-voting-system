<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Password Reset OTP</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #2c3e50;">Password Reset Request</h2>
  <p>Hello {{ full_name }},</p>
  <p>We received a request to reset your password. Use the OTP below:</p>
  <div style="text-align:center; margin: 30px 0;">
    <span style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #e74c3c; background: #fdf2f8; padding: 15px 30px; border-radius: 8px;">{{ otp }}</span>
  </div>
  <p>This OTP is valid for <strong>15 minutes</strong>. Do not share it with anyone.</p>
  <p>If you did not request a password reset, please ignore this email.</p>
  <hr><p style="color:#999;font-size:12px;">Online Voting System</p>
</body>
</html>
