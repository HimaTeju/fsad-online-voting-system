<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Voter ID Application Rejected</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #e74c3c;">Voter ID Application Rejected</h2>
  <p>Dear {{ full_name }},</p>
  <p>We regret to inform you that your Voter ID application has been <strong>rejected</strong>.</p>
  {% if remarks %}
  <div style="background: #fdf2f2; border-left: 4px solid #e74c3c; padding: 15px; margin: 20px 0;">
    <p style="margin:0;"><strong>Reason:</strong> {{ remarks }}</p>
  </div>
  {% endif %}
  <p>You may submit a new application after addressing the above issues.</p>
  <hr><p style="color:#999;font-size:12px;">Online Voting System</p>
</body>
</html>
