<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Voter ID Approved</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #27ae60;">Voter ID Application Approved</h2>
  <p>Dear {{ full_name }},</p>
  <p>Congratulations! Your Voter ID application has been <strong>approved</strong>.</p>
  <div style="background: #eafaf1; border-left: 4px solid #27ae60; padding: 15px; margin: 20px 0;">
    <p style="margin:0;font-size:16px;"><strong>Your Voter ID:</strong></p>
    <p style="margin:5px 0 0;font-size:24px;font-weight:bold;color:#27ae60;">{{ voter_id }}</p>
  </div>
  <p>Please keep your Voter ID safe. You will need it to log in and cast your vote.</p>
  <hr><p style="color:#999;font-size:12px;">Online Voting System</p>
</body>
</html>
