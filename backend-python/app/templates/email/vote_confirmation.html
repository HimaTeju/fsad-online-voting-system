<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Vote Confirmation</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #2980b9;">Your Vote Has Been Recorded</h2>
  <p>Dear {{ full_name }},</p>

</body>
</html>
